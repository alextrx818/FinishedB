[program:football-monitor]
command=/root/CascadeProjects/sports bot/football/Continuous_Run/run_with_supervisor.sh
directory=/root/CascadeProjects/sports bot/football
user=root
autostart=true
autorestart=true
startsecs=10
startretries=5
stopwaitsecs=60
redirect_stderr=true
stdout_logfile=/root/CascadeProjects/sports bot/football/logs/supervisor_stdout.log
stdout_logfile_maxbytes=50MB
stdout_logfile_backups=10
stderr_logfile=/root/CascadeProjects/sports bot/football/logs/supervisor_stderr.log
stderr_logfile_maxbytes=50MB
stderr_logfile_backups=10
